<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer {
            border: 8px solid #000080;
            width: 350px;
            height: 525px;
            margin: 20px auto 0 auto;
            border-radius: 30px;
            text-align: center;
            background: white;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-repeat: no-repeat;
            background-size: 100% auto;
            position: relative;
            overflow: hidden;

        }
        h1 {
            color: white;
            padding-top: 75px;
            text-shadow: 2px 0px black;
        }
        h2 {
            color: white;
            text-shadow: 2px 0px black;
            font-weight: 200;
            padding-bottom: 10px;
        }
        h3 {
            background-color: white;
            padding-top: 15px;
            padding-bottom: 10px;
        }
        #myForm {
            background-color: white;
            padding-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            justify-items: left;
            padding-left: 20px;
        }
        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #subscribe {
            grid-column: 1/3;
            justify-self: center;
        }
        #conditions {
            padding-top: 5px;
            grid-column: 1/3;
            justify-self: center;
        }
        #submit {
            padding-top: 5px;
            grid-column: 1/3;
            justify-self: center;
        }
        #images {
            padding-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            column-gap: 3px;
        }
        .old {
            grid-column: 1/2;
            width: 100%;
        }
         .new {
            grid-column: 2/3;
            width: 100%;
        }
         .book {
            grid-column: 3/4;
            width: 100%;
        }
         .doc {
            grid-column: 4/5;
            width: 100%;
        }
         .pearl {
            grid-column: 5/6;
            width: 100%;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <h1>Daily Feed</h1>
        <h2>Scripture a Day</h2>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section id="subscribe">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section id="conditions">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section id="submit">
                <button type="submit">Submit</button>
            </section>
        </form>
         <div id="images">
            <img class= "old" src="images/old_testament.webp" alt ="Old Testament">
            <img class= "new" src="images/new_testament.webp" alt ="New Testament">
            <img class= "book" src="images/book_of_mormon.webp" alt ="Book of Mormon">
            <img class= "doc" src="images/doctrine_and_covenants.webp" alt ="Doctrine and Covenants">
            <img class= "pearl" src="images/pearl_of_great_price.webp" alt ="Pearl of Great Price">
         </div>
    </div>
    


    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body {
            background: #e8eced;
            font-family: Arial, sans-serif;
        }
        #wrapper {
            background: url("images/christus.webp");
            border: 7px solid black;
            width: 777px;
            height: 600px;
            margin: 0 auto;
            border-radius: 30px;
            background-size: cover;
            background-position-x: -180px;
            text-align: center;
        }
        #title {
            font-size: 30px;
            color: white;
            margin: 6px 0px 4px 0px;
        }
        #Eyring {
            width: 90px;
            height: 90px;
            border: 5px solid white;
            border-radius: 50%;
           
        }
        #Oaks {
            width: 110px;
            height: 110px;
            border: 5px solid white;
            border-radius: 50%;
        }
        #Christofferson {
            width: 90px;
            height: 90px;
            border: 5px solid white;
            border-radius: 50%;
        }
        #images {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }
        #header {
            color: white;
            font-size: 20px;
            margin: 10px 0px 8px 0px;
        }
        .apostle {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(3, 80px);
            column-gap: 20px;
            row-gap: 25px;
            justify-content: center;
        }
        #uchtdorf, #bednar, #cook, #anderson, #rasband, #stevenson, #renlund, #gong, #soares, #kearon, #causse, #gilbert {
            width: 60px;
            height: 60px;
            border: 5px solid white;
            border-radius: 50%;
        }
       
    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div id="wrapper">
        <section>
            <h1 id="title">First Presidency</h1>
        </section>
    <div id="images">
        <img id="Eyring" src="images/eyring.webp" alt="Henry B. Eyring">
        <img id="Oaks" src="images/oaks.webp" alt="Dallin H. Oaks">
        <img id="Christofferson" src="images/christofferson.webp" alt="D. Todd Christofferson">
    </div>
        <section>
            <h3 id="header">Quorum of the Twelve Apostles</h3>
        </section>
    <div class="apostle">
        <img id="uchtdorf" src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf">
        <img id="bednar" src="images/bednar.webp" alt="David A. Bednar">
        <img id="cook" src="images/cook.webp" alt="Quentin L. Cook">
        <img id="anderson" src="images/anderson.webp" alt="Neil L. Anderson">
        <img id="rasband" src="images/rasband.webp" alt="Ronald A. Rasband">
        <img id="stevenson" src="images/stevenson.webp" alt="Gary E. Stevenson">
        <img id="renlund" src="images/renlund.webp" alt="Dale G. Renlund">
        <img id="gong" src="images/gong.webp" alt="Gerrit W. Gong">
        <img id="soares" src="images/soares.webp" alt="Ulisses Soares">
        <img id="kearon" src="images/kearon.webp" alt="Patrick Kearon">
        <img id="causse" src="images/causse.webp" alt="Gerld Causse">
        <img id="gilbert" src="images/gilbert.webp" alt="Clark G. Gilbert">
    </div>
     </div>
</body>
</html>

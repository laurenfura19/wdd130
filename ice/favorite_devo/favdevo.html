<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table class="devotable">
          <thead>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td>David A. Bednar</td>
            <td>BYU-Idaho 25th Anniversary Devotional</td>
            <td>BYU-Idaho Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Neil L. Andersen</td>
            <td>President Dallin H. Oaks and the Law of Witnesses</td>
            <td>BYU-Idaho Center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>James O. Fantone</td>
            <td>The Battle Is the Lord's</td>
            <td>BYU-Idaho Center</td>
            <td>2026</td>
          </tr>
          </tbody>
        </table>
        <form class="form">
          <div class="form-group">
        <label for="speaker">Speaker:</label><br>
        <input type="text" id="speaker" name="speaker"><br>
        </div>
         <div class="form-group">
        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title"><br>
        </div>
         <div class="form-group">
        <label for="location">Location:</label><br>
        <input type="text" id="location" name="location"><br>
        </div>
        <div class="form-group">
        <label for="year">Year:</label><br>
        <input type="text" id="year" name="year"><br>
        </div>
        <input type="submit" value="Submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
